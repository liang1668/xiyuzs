<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiyuzs</title>
    <style>
        :root {
            --bg1: #0f172a;
            --bg2: #1d4ed8;
            --card: rgba(15, 23, 42, 0.55);
            --text: #e2e8f0;
            --muted: #cbd5e1;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 20px;
            padding: 48px 56px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: .04em;
        }
        p {
            margin: 0;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.2rem);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>xiyuzs</h1>
        <p>GitHub Pages 已就绪</p>
    </div>
</body>
</html>
